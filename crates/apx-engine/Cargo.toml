[package]
name = "apx-engine"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "Experimental offline Apex validation and evaluation engine"

[[bin]]
name = "apx"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24.7"
tree-sitter-sfapex = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
regex = "1"
walkdir = "2"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
base64 = "0.22.1"
hex = "0.4.3"
sha2 = { version = "0.10.9", features = ["oid"] }
sha1 = { version = "0.10.6", features = ["oid"] }
md-5 = "0.10.6"
hmac = "0.12.1"
rand = "0.8.5"
rsa = "0.9.8"
subtle = "2.6.1"
roxmltree = "0.21.1"
chrono = "0.4.42"
